name: Test and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pytest -q

      - name: Regenerate reference fixtures
        run: python scripts/generate_fixtures.py

      - name: Check fixtures are committed
        run: git diff --exit-code -- web/tests/fixtures/parity.json

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: JavaScript core tests
        run: npm run test:core

      - name: Build static site
        run: npm run build

      - name: Browser tests
        run: npm run test:browser

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
